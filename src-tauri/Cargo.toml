[package]
name = "ukeplanlager"
version = "2.5.0"
description = "Verktøy for ukeplanlegging"
authors = ["Stian Taknæs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "ukeplanlager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 1
strip = true
split-debuginfo = "off"
